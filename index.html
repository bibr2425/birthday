<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>З Днем Народження, Марто!</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #ffffff;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            max-width: 480px;
            width: 100%;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .gallery {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }
        .gallery img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        h1 {
            font-size: 1.8rem;
            color: #f43f5e;
            margin-bottom: 20px;
        }
        .text-box {
            font-size: 1.1rem;
            line-height: 1.7;
            color: #e2e8f0;
            margin-bottom: 28px;
            background: rgba(0, 0, 0, 0.25);
            padding: 20px;
            border-radius: 16px;
            white-space: pre-line;
        }
        .btn {
            background: linear-gradient(135deg, #f43f5e, #e11d48);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(244, 63, 94, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div class="card">
        <div class="gallery">
            <img id="main-photo" src="images.jpg" alt="Photo">
        </div>
        <h1>🎉 З Днем Народження, Марто! 🎉</h1>
        <div class="text-box">
Вітаю з др мбіч

Бажаю, щоб все в тебе було чотінько,
міцного здоров'я,багато деняк і тд,
і все люді пешкі біг боб арешкі

Від Максіма (Бетмен) 🦇
        </div>
        <button class="btn" onclick="celebrate()">Відкрити сюрприз ✨</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
        function celebrate() {
            // Міняємо картинку на marta.jpg
            const photo = document.getElementById('main-photo');
            photo.src = 'marta.jpg';
            photo.style.transform = 'scale(1.05)';

            // Запускаємо конфеті
            confetti({
                particleCount: 150,
                spread: 80,
                origin: { y: 0.6 }
            });
        }
    </script>
</body>
</html>
